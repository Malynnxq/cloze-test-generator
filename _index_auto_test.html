<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Cloze-Test (Minimal + Timer)</title>
    <link rel="stylesheet" href="style.css?v=20260220-11">
    <link rel="stylesheet" href="https://tikzjax.com/v1/fonts.css">

    <!-- MathJax 3 (TeX → SVG) — додано -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script defer src="https://tikzjax.com/v1/tikzjax.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>

<body>
    <h1>Cloze-Test (перший крок)</h1>


    <!-- ====== Таймер ====== -->
    <div id="timerPanel" role="group" aria-label="Таймер вправи">
        <span id="timerDisplay" aria-live="polite">00:00</span>
        <button id="timerStartPause">Старт</button>
        <button id="timerReset" disabled>Скинути</button>
        <label style="margin-left:.5rem"><input type="checkbox" id="autoStart" checked> Авто-старт при генерації</label>
        <label><input type="checkbox" id="autoStop" checked> Авто-стоп при перевірці</label>
    </div>

    <!-- ЗОБРАЖЕННЯ: авто-оклюзія -->
    <h2>Зображення</h2>
    <div class="row">
        <input type="file" id="imgInput" accept="image/*" multiple>
        <label><input type="checkbox" id="imgAuto" checked> Авто-оклюзія (випадкові ділянки)</label>
        <!-- існуючий тумблер логів -->
        <label style="margin-left:1rem"><input type="checkbox" id="debugLog"> Показувати логи</label>
        <!-- НОВЕ: окремий відсоток складності для зображень -->
        <label style="margin-left:1rem">Складність зображень (%):
            <input id="imgPercent" type="number" value="20" min="0" max="100" step="5">
        </label>
    </div>
    <div id="figures"></div>
    <hr>

    <!-- 1) Ввід тексту -->
    <label for="text">Встав свій текст:</label><br>
    <textarea id="text"
        placeholder="Наприклад: Heute lernen wir Reihen. Die berühmte Formel lautet $E=mc^2$."></textarea>

    <!-- 2) Налаштування + кнопки -->
    <div id="controls">
        <label for="percent">Складність (% пропусків):</label>
        <input id="percent" type="number" value="20" min="0" max="100" step="5">
        <button id="btnGen">Створити пропуски</button>
        <button id="btnCheck">Перевірити</button>
        <!-- додано: математика -->
        <div style="margin-top:.5rem">
            <label><input type="checkbox" id="processMath"> Перевіряти математичну нотацію</label>
            <label style="margin-left:1rem"><input type="checkbox" id="noHideMathCommands"> Не ховати команди в
                математиці</label>
            <label style="margin-left:1rem"><input type="checkbox" id="ignorePunctuation"> Не перевіряти пунктуацію</label>
            <label style="margin-left:1rem"><input type="checkbox" id="speedMode">&#1053;&#1072; &#1096;&#1074;&#1080;&#1076;&#1082;&#1110;&#1089;&#1090;&#1100;</label>
        </div>
        <div id="speedPanel" hidden>
            <label for="speedMinutes">&#1063;&#1072;&#1089; (&#1093;&#1074;):
                <input id="speedMinutes" type="number" min="1" step="1" value="5">
            </label>
            <span id="speedStatus" aria-live="polite"></span>
        </div>
    </div>

    <!-- 3) Вивід тесту з пропусками -->
    <div id="output"></div>

    <!-- 3.1) Додано: інпут-список для формул -->
    <h3 id="mathHeader" style="display:none;">Математичні відповіді</h3>
    <div id="mathInputs"></div>

    <!-- 4) Результат перевірки -->
    <p id="result"></p>

    <script defer src="app.js?v=20260220-12"></script>
<script>
window.addEventListener('load', () => {
  const t = document.getElementById('text');
  const btn = document.getElementById('btnGen');
  if (!t || !btn) return;
  t.value = String.raw`\begin{tikzpicture}[>=stealth, line cap=round, line join=round]
  \draw[->] (-3.2,0) -- (6.8,0);
  \draw[->] (0,-2.4) -- (0,2.8);
  \node[below left] at (0,0) {</body>$};
  \coordinate (Z)  at (2.2,1.5);
  \coordinate (Zb) at (2.2,-1.5);
  \coordinate (T)  at (2.7,0.45);
  \coordinate (S)  at (4.9,1.95);
  \draw[dashed] (Z) -- (2.2,0);
  \draw[dashed] (Z) -- (0,1.5);
  \draw[dashed] (Zb) -- (2.2,0);
  \draw[dashed] (Zb) -- (0,-1.5);
  \fill (0,1) circle (1.5pt);
  \node[left] at (0,1) {$i$};
  \node[left] at (0,-1.5) {$-y$};
  \node[below] at (2.2,0) {$x$};
  \node[below] at (1.0,0) {$1$};
  \draw[->,thick] (0,0) -- (Z)  node[midway,above left] {$z=(x,y)$};
  \draw[->,thick] (0,0) -- (Zb) node[midway,below right] {$\bar z$};
  \draw[->,thick] (0,0) -- (T)  node[midway,above] {$\tilde z$};
  \draw[->,thick] (Z) -- (S);
  \draw[->,thick] (T) -- (S);
  \fill (Z)  circle (1.7pt);
  \fill (Zb) circle (1.7pt);
  \fill (S)  circle (1.7pt);
  \node[above right] at (S) {$z+\tilde z$};
  \node[right] at (6.6,-0.35) {reelle Achse};
  \node[left]  at (-0.15,2.55) {imagin\"{a}re Achse};
\end{tikzpicture}`;
  setTimeout(() => btn.click(), 1200);
});
</script>
</body>

</html>
