<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Cloze-Test (Minimal + Timer)</title>
    <link rel="stylesheet" href="style.css">

    <!-- MathJax 3 (TeX → SVG) — додано -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>

<body>
    <h1>Cloze-Test (перший крок)</h1>


    <!-- ====== Таймер ====== -->
    <div id="timerPanel" role="group" aria-label="Таймер вправи">
        <span id="timerDisplay" aria-live="polite">00:00</span>
        <button id="timerStartPause">Старт</button>
        <button id="timerReset" disabled>Скинути</button>
        <label style="margin-left:.5rem"><input type="checkbox" id="autoStart" checked> Авто-старт при генерації</label>
        <label><input type="checkbox" id="autoStop" checked> Авто-стоп при перевірці</label>
    </div>

    <!-- ЗОБРАЖЕННЯ: авто-оклюзія -->
    <h2>Зображення</h2>
    <div class="row">
        <input type="file" id="imgInput" accept="image/*" multiple>
        <label><input type="checkbox" id="imgAuto" checked> Авто-оклюзія (випадкові ділянки)</label>
        <!-- існуючий тумблер логів -->
        <label style="margin-left:1rem"><input type="checkbox" id="debugLog"> Показувати логи</label>
        <!-- НОВЕ: окремий відсоток складності для зображень -->
        <label style="margin-left:1rem">Складність зображень (%):
            <input id="imgPercent" type="number" value="20" min="0" max="100" step="5">
        </label>
    </div>
    <div id="figures"></div>
    <hr>

    <!-- 1) Ввід тексту -->
    <label for="text">Встав свій текст:</label><br>
    <textarea id="text"
        placeholder="Наприклад: Heute lernen wir Reihen. Die berühmte Formel lautet $E=mc^2$."></textarea>

    <!-- 2) Налаштування + кнопки -->
    <div id="controls">
        <label for="percent">Складність (% пропусків):</label>
        <input id="percent" type="number" value="20" min="0" max="100" step="5">
        <button id="btnGen">Створити пропуски</button>
        <button id="btnCheck">Перевірити</button>
        <!-- додано: математика -->
        <div style="margin-top:.5rem">
            <label><input type="checkbox" id="processMath"> Перевіряти математичну нотацію</label>
            <label style="margin-left:1rem"><input type="checkbox" id="noHideMathCommands"> Не ховати команди в
                математиці</label>
            <label style="margin-left:1rem"><input type="checkbox" id="ignorePunctuation"> Не перевіряти пунктуацію</label>
        </div>
    </div>

    <!-- 3) Вивід тесту з пропусками -->
    <div id="output"></div>

    <!-- 3.1) Додано: інпут-список для формул -->
    <h3 id="mathHeader" style="display:none;">Математичні відповіді</h3>
    <div id="mathInputs"></div>

    <!-- 4) Результат перевірки -->
    <p id="result"></p>

    <script defer src="app.js"></script>
</body>

</html>
